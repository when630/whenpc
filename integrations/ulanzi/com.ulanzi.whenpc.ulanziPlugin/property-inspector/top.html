<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>whenpc</title>
  <link rel="stylesheet" href="../libs/css/uspi.css">
  <style>.note { color: #9a9a9a; font-size: 12px; line-height: 1.5; padding: 4px 0 0; }</style>
</head>
<body>
  <div class="uspi-wrapper hidden">
    <form id="property-inspector">
      <div class="uspi-item">
        <div class="uspi-item-label">기준</div>
        <select class="uspi-item-value select" name="basis" id="basis">
          <option value="cpu">CPU</option>
          <option value="mem">메모리</option>
        </select>
      </div>
    </form>
    <div class="note">CPU 또는 메모리를 가장 많이 쓰는 프로세스 3개예요. 같은 이름의 프로세스는 합쳐서 보여 줘요. 메모리는 다른 프로세스와 공유하지 않는 메모리(개인 작업 집합) 기준이에요. 누르면 위젯 상세 패널을 그 탭으로 열어요. 이 키가 있는 동안 whenpc가 프로세스별 사용량을 모아서 CPU를 조금 더 써요.</div>
  </div>
  <script src="../libs/js/constants.js"></script>
  <script src="../libs/js/eventEmitter.js"></script>
  <script src="../libs/js/timers.js"></script>
  <script src="../libs/js/utils.js"></script>
  <script src="../libs/js/ulanziApi.js"></script>
  <script>
    const sel = document.getElementById('basis')
    const form = document.getElementById('property-inspector')
    const load = (jsn) => { if (jsn && jsn.param && jsn.param.basis) sel.value = jsn.param.basis }
    $UD.connect()
    $UD.onConnected(() => {
      document.querySelector('.uspi-wrapper').classList.remove('hidden')
      form.addEventListener('change', () => $UD.sendParamFromPlugin({ basis: sel.value }))
    })
    $UD.onAdd(load)
    $UD.onParamFromApp(load)
  </script>
</body>
</html>

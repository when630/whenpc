<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:">
  <title>whenpc 설정</title>
  <link rel="stylesheet" href="../../node_modules/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/archivo/900.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/black-han-sans/400.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/geist-mono/400.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/geist-mono/500.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/noto-serif-kr/400.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/gaegu/400.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/gaegu/700.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="titlebar">
    <div>
      <h1>설정</h1>
      <p class="lead">바꾸는 즉시 위젯에 반영됩니다.</p>
    </div>
    <button id="close" type="button" title="닫기" aria-label="닫기">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 3.5l9 9m0-9-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>
  <main>

    <section>
      <h2>스킨</h2>
      <div class="skins" id="skins" role="radiogroup" aria-label="스킨"></div>
    </section>

    <section>
      <h2>테마</h2>
      <div class="themes" id="themes" role="radiogroup" aria-label="테마"></div>
    </section>

    <section>
      <h2>앱 아이콘</h2>
      <div class="icons" id="icons" role="radiogroup" aria-label="앱 아이콘"></div>
      <p class="hint">트레이와 창 아이콘이 바로 바뀝니다. 설치 파일과 바로가기 아이콘은 BARS로 고정입니다.</p>
    </section>

    <section>
      <h2>스트림덱 키</h2>
      <div class="group">
        <label class="row">
          <span class="row-text">위젯과 같은 스킨·테마<small>끄면 Ulanzi 덱 키에 쓸 스킨과 테마를 따로 고릅니다</small></span>
          <input type="checkbox" class="switch" id="deckFollow">
        </label>
      </div>
      <div id="deckPick" class="deck-pick" hidden>
        <h3>덱 스킨</h3>
        <div class="skins" id="deckSkins" role="radiogroup" aria-label="덱 스킨"></div>
        <h3>덱 테마</h3>
        <div class="themes" id="deckThemes" role="radiogroup" aria-label="덱 테마"></div>
      </div>
      <p class="hint">덱 키는 테마의 색과 스킨의 글꼴 느낌을 따릅니다. whenpc 덱 플러그인이 설치되어 있어야 합니다.</p>
    </section>

    <section>
      <h2>표시 항목</h2>
      <div class="group" id="items"></div>
    </section>

    <section>
      <h2>모양</h2>
      <div class="group">
        <div class="field">
          <div class="field-head">
            <label for="transparency">배경 투명도</label>
            <output id="transparency-out"></output>
          </div>
          <input type="range" id="transparency" min="0" max="100" step="5">
          <div class="scale-hints"><span>불투명</span><span>완전 투명</span></div>
        </div>
        <div class="field">
          <div class="field-head">
            <label for="scale">크기</label>
            <output id="scale-out"></output>
          </div>
          <input type="range" id="scale" min="80" max="150" step="5">
          <div class="scale-hints"><span>작게</span><span>크게</span></div>
        </div>
        <label class="row">
          <span class="row-text">그래프 표시<small>항목마다 최근 60초 추이를 그립니다</small></span>
          <input type="checkbox" class="switch" id="showGraphs">
        </label>
      </div>
    </section>

    <section>
      <h2>동작</h2>
      <div class="group">
        <label class="row">
          <span class="row-text">항상 위에 표시<small>다른 창보다 위에 띄웁니다</small></span>
          <input type="checkbox" class="switch" id="alwaysOnTop">
        </label>
        <label class="row">
          <span class="row-text">위치 고정 (클릭 통과)<small>위젯이 클릭을 받지 않습니다. 해제는 트레이 아이콘 메뉴에서도 할 수 있습니다</small></span>
          <input type="checkbox" class="switch" id="locked">
        </label>
        <div class="row">
          <span class="row-text">숨기기/보이기 단축키<small id="shortcutHint"></small></span>
          <span class="shortcut">
            <button id="shortcut" type="button" class="kbd"></button>
            <button id="shortcutClear" type="button" title="단축키 끄기" aria-label="단축키 끄기">끄기</button>
          </span>
        </div>
        <label class="row">
          <span class="row-text">Windows 시작 시 실행</span>
          <input type="checkbox" class="switch" id="openAtLogin">
        </label>
        <div class="row">
          <span class="row-text">위젯 위치<small>주 모니터 오른쪽 위로 되돌립니다</small></span>
          <button id="resetPosition" type="button">초기화</button>
        </div>
      </div>
    </section>

    <section>
      <h2>업데이트</h2>
      <div class="group">
        <div class="row">
          <span class="row-text"><span>whenpc <span id="appVersion"></span></span><small id="updateStatus"></small></span>
          <button id="updateBtn" type="button" hidden></button>
        </div>
      </div>
    </section>
  </main>
  <script src="settings.js"></script>
</body>
</html>
